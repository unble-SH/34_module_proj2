<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>문의글 작성</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 700px;
            margin: 50px auto;
            padding: 30px;

            background-color: white;

            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 250px;

            box-sizing: border-box;

            padding: 10px;

            resize: vertical;
        }

        button {
            margin-top: 15px;
            padding: 10px 20px;

            border: none;
            border-radius: 5px;

            background-color: #333;
            color: white;

            cursor: pointer;
        }

        .error {
            color: red;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>문의글 작성</h1>


    {% if error %}

    <p class="error">
        {{ error }}
    </p>

    {% endif %}


    <form method="POST">

        <textarea
            name="content"
            placeholder="문의 내용을 입력해주세요."
            required
        ></textarea>


        <br>

        <button type="submit">
            작성하기
        </button>

    </form>

</div>

</body>

</html>
