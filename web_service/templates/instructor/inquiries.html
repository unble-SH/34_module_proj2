<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <title>문의 게시판 관리</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
        }

        .container {
            width: 800px;
            margin: 50px auto;
            padding: 30px;

            background-color: white;

            border-radius: 10px;
        }

        .inquiry {
            border: 1px solid #ddd;

            padding: 20px;

            margin-bottom: 15px;
        }

        .content {
            margin: 15px 0;

            white-space: pre-wrap;
        }

        a {
            display: inline-block;

            padding: 10px 15px;

            text-decoration: none;

            color: white;

            background-color: #333;

            border-radius: 5px;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>문의 게시판</h1>


    {% for inquiry in inquiries %}

    <div class="inquiry">

        <div>
            <strong>
                {{ inquiry.inquiry_id }}
            </strong>
        </div>

        <div>
            작성자:
            {{ inquiry.student.name }}
            ({{ inquiry.student.username }})
        </div>

        <div class="content">
            {{ inquiry.content }}
        </div>

        <a href="{{ url_for(
            'inquiry_detail',
            inquiry_id=inquiry.inquiry_id
        ) }}">
            확인 / 댓글 작성
        </a>

    </div>


    {% else %}

    <p>
        등록된 문의글이 없습니다.
    </p>

    {% endfor %}


    <br>

    <a href="{{ url_for('instructor_home') }}">
        강사 페이지
    </a>

</div>

</body>

</html>
